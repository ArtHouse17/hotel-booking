server:
  port: 8761
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  application:
    name: discovery-server
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
