server:
  port: 8082
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:h2:mem:bookings;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
security:
  jwt-secret: ${JWT_SECRET:local-development-only-secret-change-before-deploy-1234567890}
eureka:
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_HOSTNAME:localhost}
    lease-renewal-interval-in-seconds: 5
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
