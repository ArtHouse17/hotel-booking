server:
  port: 8080
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 45s
security:
  jwt-secret: ${JWT_SECRET:local-development-only-secret-change-before-deploy-1234567890}
eureka:
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
springdoc:
  swagger-ui:
    urls:
      - name: Booking and Users
        url: /docs/booking
      - name: Hotels and Rooms
        url: /docs/hotels
management:
  endpoints:
    web:
      exposure:
        include: health,info
